<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      interactive-widget=resizes-content : sans ce réglage, l'ouverture du
      clavier mobile ne redimensionne QUE le "visual viewport" (ce qui est
      visible à l'écran) tout en laissant le "layout viewport" (celui dans
      lequel `position: fixed`/`sticky` se calculent) inchangé — la barre de
      navigation basse (fixed bottom-0, voir AppLayout.jsx BottomNav) reste
      alors ancrée à un "bas de page" désormais caché sous le clavier,
      pendant que le navigateur fait défiler le visual viewport pour garder
      le champ focalisé visible : les deux mécanismes se disputent l'écran,
      d'où l'instabilité pendant la saisie. `resizes-content` fait
      redimensionner le layout viewport lui-même avec le clavier, la barre
      basse reste alors correctement juste au-dessus du clavier.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fafafa" />
    <title>Gestion d'Atelier</title>
    <!--
      Applique le theme clair/sombre AVANT le premier rendu React, pour
      eviter un flash du mauvais theme au chargement (ex: preference
      "sombre" mais l'app affiche le clair une fraction de seconde le temps
      que React demarre). Doit rester un <script> classique synchrone (pas
      type="module", pas defere) et dupliquer volontairement la logique de
      src/lib/theme.js : un module ES est charge de facon differee, donc
      inutilisable ici pour ce role precis.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("am-couture-theme");
          var theme = stored === "light" || stored === "dark" ? stored : null;
          if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0a0a0a" : "#fafafa");
        } catch {
          // localStorage/matchMedia indisponible : repli sur le theme clair
          // par defaut, deja en place sans aucune classe a poser.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
