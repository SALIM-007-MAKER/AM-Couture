name: CI

# Vérifie automatiquement chaque push/PR sur main : lint, build frontend,
# tests unitaires backend, tests d'intégration multi-tenant. Aucun secret
# nécessaire nulle part dans ce workflow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + build + tests UNITAIRES (sans base de données, voir
  # backend/src/**/__tests__/) — jamais connecté à une base, ne touche donc
  # jamais la base Neon partagée dev/prod.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le client Prisma généré n'est jamais commité (voir .gitignore) —
      # nécessaire ici car backend/src/lib/money.js importe le client généré
      # (pour Prisma.Decimal), même dans les tests qui ne touchent aucune base.
      - run: npx prisma generate --schema prisma/schema.prisma

      - run: npm run lint -w frontend

      - run: npm run build -w frontend

      - run: npm test

  # Tests d'INTÉGRATION multi-tenant (isolation entre ateliers, IDOR, essai
  # gratuit, abonnement, impersonation — voir backend/src/integration-tests/)
  # contre une vraie base Postgres, mais TOUJOURS le service jetable ci-dessous
  # (créé et détruit avec le job), jamais Neon — voir preload.js, qui refuse
  # de démarrer si TEST_DATABASE_URL ne pointe pas explicitement vers une base
  # dédiée aux tests.
  tests-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gestion_atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate --schema prisma/schema.prisma

      - name: Applique les migrations sur la base Postgres jetable du service CI
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gestion_atelier_test
          DIRECT_URL: postgresql://test:test@localhost:5432/gestion_atelier_test

      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/gestion_atelier_test
